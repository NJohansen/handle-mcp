<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Your AI agent plans the week's meals on a budget, handle-mcp finds the cheapest cart, and you pay and get the delivery">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
@keyframes s1{0%,1%{opacity:0;transform:translate(0px,10px)}5%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.s1{animation:s1 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes l0{0%,6%{opacity:0;transform:translate(-8px,0px)}10%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.l0{animation:l0 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes l1{0%,12%{opacity:0;transform:translate(-8px,0px)}16%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.l1{animation:l1 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes l2{0%,18%{opacity:0;transform:translate(-8px,0px)}22%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.l2{animation:l2 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes a1{0%,26%{stroke-dashoffset:120}33%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
.a1{stroke-dasharray:120;animation:a1 9s ease-in-out infinite}
@keyframes h1{0%,32%{opacity:0;transform:translate(0px,0px)}36%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.h1{animation:h1 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes i0{0%,36%{opacity:0;transform:translate(0px,-50px)}40%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.i0{animation:i0 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes i1{0%,41%{opacity:0;transform:translate(0px,-50px)}45%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.i1{animation:i1 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes i2{0%,46%{opacity:0;transform:translate(0px,-50px)}50%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.i2{animation:i2 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes i3{0%,51%{opacity:0;transform:translate(0px,-50px)}55%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.i3{animation:i3 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
