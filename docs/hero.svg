<g class="i2"><path d="M458 104 q-4 -30 12 -40 q16 10 12 40z" fill="#f59e0b"/><path d="M470 64 l-5 -10 M470 64 l5 -10" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/></g>
<g class="i3"><ellipse cx="502" cy="94" rx="20" ry="13" fill="#b45309"/><path d="M490 90 h24 M492 97 h20" stroke="#fcd34d" stroke-width="2"/></g>
<g class="s2"><path d="M382 104 H538 L522 168 H398 Z" fill="#fff" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/><path d="M418 116 V156 M444 116 V156 M470 116 V156 M496 116 V156" stroke="#d1d5db" stroke-width="3" stroke-linecap="round"/><path d="M400 104 Q460 40 520 104" stroke="#1f2937" stroke-width="3" fill="none"/></g>
<g class="p2"><rect x="470" y="140" width="92" height="30" rx="15" fill="#16a34a"/><text x="516" y="160" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">847 kr</text></g>
<path class="a2" d="M576 104 H666" stroke="#6b7280" stroke-width="3" fill="none" stroke-linecap="round"/>
<path class="h2" d="M658 96 l10 8 l-10 8" stroke="#6b7280" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g class="s3"><path d="M700 92 H860 V168 H700 Z" fill="#d6a76c" stroke="#92602b" stroke-width="3" stroke-linejoin="round"/><path d="M700 92 L716 68 H844 L860 92" fill="#e8c08d" stroke="#92602b" stroke-width="3" stroke-linejoin="round"/><rect x="766" y="92" width="28" height="30" fill="#f5deb3" stroke="#92602b" stroke-width="2"/></g>
<g class="c3"><circle cx="846" cy="76" r="18" fill="#16a34a"/><path d="M837 76 l6 6 l12 -12" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="t0" x="140" y="212" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">1. Your agent plans</text>
<text class="t1" x="460" y="212" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">2. Cheapest cart</text>
<text class="t2" x="780" y="212" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">3. You pay, it arrives</text>
