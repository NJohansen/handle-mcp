.s2{animation:s2 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p2{0%,56%{opacity:0;transform:translate(0px,0px) scale(.6)}60%,90%{opacity:1;transform:translate(0,0) scale(1)}97%,100%{opacity:0;transform:translate(0,0) scale(1)}}
.p2{animation:p2 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes a2{0%,60%{stroke-dashoffset:120}67%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
.a2{stroke-dasharray:120;animation:a2 9s ease-in-out infinite}
@keyframes h2{0%,66%{opacity:0;transform:translate(0px,0px)}70%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.h2{animation:h2 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes s3{0%,69%{opacity:0;transform:translate(0px,12px)}73%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.s3{animation:s3 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes c3{0%,76%{opacity:0;transform:translate(0px,0px) scale(.6)}80%,90%{opacity:1;transform:translate(0,0) scale(1)}97%,100%{opacity:0;transform:translate(0,0) scale(1)}}
.c3{animation:c3 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes t0{0%,1%{opacity:0;transform:translate(0px,0px)}5%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.t0{animation:t0 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes t1{0%,33%{opacity:0;transform:translate(0px,0px)}37%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.t1{animation:t1 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes t2{0%,69%{opacity:0;transform:translate(0px,0px)}73%,90%{opacity:1;transform:translate(0,0)}97%,100%{opacity:0;transform:translate(0,0)}}
.t2{animation:t2 9s ease-out infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
</style>
<rect width="900" height="240" rx="20" fill="#f6f4ff"/>
<g class="s1"><rect x="40" y="40" width="200" height="118" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/><path d="M70 158 l-8 18 l26 -18z" fill="#fff" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round"/><rect x="66" y="156" width="26" height="5" fill="#fff"/><path d="M64 62 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z" fill="#7c3aed"/></g>
<text class="l0" x="86" y="80" font-size="15" fill="#1f2937" font-weight="600">Week's meal plan</text>
<text class="l1" x="64" y="108" font-size="15" fill="#6b7280" font-weight="400">Budget: 900 kr</text>
<text class="l2" x="64" y="134" font-size="15" fill="#6b7280" font-weight="400">Built on offers</text>
<path class="a1" d="M262 104 H352" stroke="#6b7280" stroke-width="3" fill="none" stroke-linecap="round"/>
