<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="An AI sparkle turns into a shopping basket, then into a delivery box">
<style>
.i{fill:none;stroke:#1f2328;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;transform-box:view-box;transform-origin:300px 100px;animation:6s cubic-bezier(.65,0,.35,1) infinite}
@media (prefers-color-scheme:dark){.i{stroke:#e6edf3}}
.ai{animation-name:ai}.cart{animation-name:cart}.box{animation-name:box}
@keyframes ai{0%,26%{opacity:1;transform:scale(1) rotate(0)}34%,92%{opacity:0;transform:scale(.4) rotate(90deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes cart{0%,26%{opacity:0;transform:scale(.4)}34%,59%{opacity:1;transform:scale(1)}67%,100%{opacity:0;transform:scale(.4)}}
@keyframes box{0%,59%{opacity:0;transform:scale(.4) translateY(30px)}67%,92%{opacity:1;transform:scale(1) translateY(0)}100%{opacity:0;transform:scale(.4) translateY(0)}}
@media (prefers-reduced-motion:reduce){.i{animation:none}.ai,.box{opacity:0}}
</style>
<g class="i ai">
  <path d="M300 48 C305 82 318 95 352 100 C318 105 305 118 300 152 C295 118 282 105 248 100 C282 95 295 82 300 48 Z"/>
  <path d="M352 50 C354 60 358 64 368 66 C358 68 354 72 352 82 C350 72 346 68 336 66 C346 64 350 60 352 50 Z"/>
</g>
<g class="i cart">
  <path d="M240 88 H360 L346 148 H254 Z"/>
  <path d="M258 88 L282 52 M342 88 L318 52"/>
  <path d="M280 106 V130 M300 106 V130 M320 106 V130"/>
</g>
<g class="i box">
  <path d="M300 46 L356 72 V130 L300 156 L244 130 V72 Z"/>
  <path d="M244 72 L300 98 L356 72 M300 98 V156"/>
  <path d="M272 59 L328 85 V105"/>
</g>
</svg>
