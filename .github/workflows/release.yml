name: release
# One button: Actions > release > Run workflow, with the version from the
# merged release PR. Tests and builds main, waits for the maintainer to
# approve the `pypi` environment, publishes to PyPI, then tags main and
# creates the GitHub release, and lists it in the MCP Registry.
# Trusted Publishing: PyPI trusts this workflow in the `pypi` environment,
# so no PyPI token is stored in GitHub.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.7.4 (must equal pyproject.toml on main)"
        required: true
        type: string
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Run from main only
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run this workflow on main, not $GITHUB_REF" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
      - name: Version must match the code and be new
        id: check
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version $VERSION is not X.Y.Z" >&2
            exit 1
          fi
          code=$(uv version --short)
          if [ "$VERSION" != "$code" ]; then
            echo "Version $VERSION does not match $code in pyproject.toml on main" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION exists already" >&2
            exit 1
          fi
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - run: uv sync --python 3.12
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: dist/
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/handle-mcp
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
  github-release:
    # Tags the built commit and writes the notes from the merged PR titles
    # since the last release. Runs after PyPI, so a tag always has a package.
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - run: gh release create "v$VERSION" --target "$SHA" --title "$VERSION" --generate-notes
  registry:
    # Lists the release in the official MCP Registry (server.json at the
    # built commit). GitHub OIDC proves we own io.github.NJohansen/*.
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # GitHub OIDC login to the registry
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
