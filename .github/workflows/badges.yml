name: badges
# The README clones badge: shields.io reads clones.json on the `badges` branch.
# GitHub keeps traffic for 14 days only, so each run saves the days it sees.
#
# Needs secret TRAFFIC_TOKEN in the environment `badges` (Settings > Environments,
# deployment branches: main only). A fine-grained token for this repo only,
# "Administration: read", with an expiry date. The traffic API needs it;
# GITHUB_TOKEN cannot get it. Never runs on pull requests, so forks never see it.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: badges
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: badges
    permissions: {}
    steps:
      - name: Fetch the clone counts
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret TRAFFIC_TOKEN is not set in the environment 'badges'."
            exit 1
          fi
          gh api "repos/$REPO/traffic/clones" > traffic.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: traffic
          path: traffic.json
          retention-days: 1
  write:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # push to the badges branch only; main is protected
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: traffic
          path: ${{ runner.temp }}
      - name: Switch to the badges branch
        run: |
          cp .github/badges/make.py "$RUNNER_TEMP/make.py"
          if git fetch -q --depth 1 origin badges; then
            git checkout -q -B badges FETCH_HEAD
          else  # first run
            git checkout -q --orphan badges
            git rm -rq --cached .
            git clean -fdq
          fi
      - name: Write the badge
        run: |
          cp "$RUNNER_TEMP/traffic.json" .
          python3 -I "$RUNNER_TEMP/make.py"
          rm traffic.json
      - name: Commit to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clones.json clones-history.json
          git diff --cached --quiet && exit 0
          git commit -qm "Update clone count"
          git push origin HEAD:badges
